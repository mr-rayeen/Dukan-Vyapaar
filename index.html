<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // 1. Suppress Vite HMR WebSocket closed without opened console errors & unhandled rejections
        var origError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var text = args
            .map(function (a) {
              return a && a.message ? a.message : String(a);
            })
            .join(' ');
          if (text.indexOf('WebSocket closed without opened') !== -1) {
            return;
          }
          return origError.apply(console, args);
        };

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var msg =
              event && event.reason
                ? event.reason.message || String(event.reason)
                : '';
            if (msg.indexOf('WebSocket closed without opened') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            var msg = (event && event.message) || '';
            if (msg.indexOf('WebSocket closed without opened') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );

        // 2. Shim Vite HMR WebSocket so @vite/client never rejects when HMR is disabled behind proxy
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var ShimmedWebSocket = function (url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isViteHmr) {
              var dummy = new EventTarget();
              dummy.readyState = 1; // OPEN
              dummy.send = function () {};
              dummy.close = function () {};
              dummy. binaryType = 'blob';
              dummy.bufferedAmount = 0;
              dummy.extensions = '';
              dummy.protocol = 'vite-hmr';
              dummy.url = String(url || '');
              setTimeout(function () {
                var openEvt = new Event('open');
                if (typeof dummy.onopen === 'function') dummy.onopen(openEvt);
                dummy.dispatchEvent(openEvt);
              }, 10);
              return dummy;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          ShimmedWebSocket.prototype = NativeWebSocket.prototype;
          ShimmedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          ShimmedWebSocket.OPEN = NativeWebSocket.OPEN;
          ShimmedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          ShimmedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = ShimmedWebSocket;
        }
      })();
    </script>
